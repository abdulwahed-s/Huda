group = 'com.aw.huda.prayer'
version = '0.1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
        classpath 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.2.20-2.0.4'
    }
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace 'com.aw.huda.prayer'
    compileSdk 37
    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions {
        unitTests.includeAndroidResources = true
        targetSdk = (project.findProperty('hudaPrayerTestTargetSdk') ?: '36').toInteger()
    }
    // Device acceptance fixtures stay outside production and ordinary test APKs.
    if (project.hasProperty('hudaPrayerDeviceResources')) {
        sourceSets.androidTest.res.srcDir(project.property('hudaPrayerDeviceResources'))
    }
    if (project.hasProperty('hudaPrayerDeviceAssets')) {
        sourceSets.androidTest.assets.srcDir(project.property('hudaPrayerDeviceAssets'))
    }
}
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
dependencies {
    implementation project(':prayer_core')
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
}
