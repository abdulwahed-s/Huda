name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit SHA or immutable tag to build (blank uses the selected run commit)'
        type: string
        required: false
      dry_run:
        description: 'Build all platforms only — skip every store upload'
        type: boolean
        default: false
      all_stores:
        description: 'Publish every store'
        type: boolean
        default: false
      google_play:
        description: 'Publish Google Play'
        type: boolean
        default: false
      appgallery:
        description: 'Publish Huawei AppGallery'
        type: boolean
        default: false
      ios_app_store:
        description: 'Publish Apple App Store (iOS)'
        type: boolean
        default: false
      macos_app_store:
        description: 'Publish Apple App Store (macOS)'
        type: boolean
        default: false
      snapcraft:
        description: 'Publish Snapcraft'
        type: boolean
        default: false
      microsoft_store:
        description: 'Publish Microsoft Store'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.44.2'
  RELEASE_SOURCE_REF: ${{ inputs.source_ref || github.sha }}

permissions:
  contents: write

jobs:
  # Tag pushes always build and publish every target. Manual runs are deliberately
  # opt-in: select one or more stores, or choose dry_run to build everything.
  release-plan:
    name: Validate release selection
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual selection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ALL_STORES: ${{ inputs.all_stores }}
          GOOGLE_PLAY: ${{ inputs.google_play }}
          APPGALLERY: ${{ inputs.appgallery }}
          IOS_APP_STORE: ${{ inputs.ios_app_store }}
          MACOS_APP_STORE: ${{ inputs.macos_app_store }}
          SNAPCRAFT: ${{ inputs.snapcraft }}
          MICROSOFT_STORE: ${{ inputs.microsoft_store }}
        run: |
          if [[ "$DRY_RUN" != "true" &&
                "$ALL_STORES" != "true" &&
                "$GOOGLE_PLAY" != "true" &&
                "$APPGALLERY" != "true" &&
                "$IOS_APP_STORE" != "true" &&
                "$MACOS_APP_STORE" != "true" &&
                "$SNAPCRAFT" != "true" &&
                "$MICROSOFT_STORE" != "true" ]]; then
            echo "Select at least one store, or enable dry_run." >&2
            exit 1
          fi

  # ──────────────────────────────────────────────────────────
  # Android — shared build for Google Play and AppGallery
  # ──────────────────────────────────────────────────────────
  build-android:
    name: Build · Android
    needs: release-plan
    if: >-
      ${{
        github.event_name == 'push' ||
        inputs.dry_run ||
        inputs.all_stores ||
        inputs.google_play ||
        inputs.appgallery
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build AAB (gplay)
        run: flutter build appbundle --release --flavor gplay

      - name: Build per-ABI APKs (gplay)
        run: flutter build apk --release --flavor gplay --split-per-abi

      - name: Build per-ABI APKs (foss)
        env:
          ORG_GRADLE_PROJECT_hudaUseLegacyPackaging: 'true'
        run: flutter build apk --release --flavor foss --split-per-abi

      - name: Verify per-ABI APKs
        shell: bash
        run: |
          for flavor in gplay foss; do
            for abi in armeabi-v7a arm64-v8a x86_64; do
              apk="build/app/outputs/flutter-apk/app-${abi}-${flavor}-release.apk"
              if [[ ! -f "$apk" ]]; then
                echo "Missing expected APK: $apk" >&2
                exit 1
              fi
            done
          done

      - name: Build AAB (foss)
        env:
          ORG_GRADLE_PROJECT_hudaUseLegacyPackaging: 'true'
        run: flutter build appbundle --release --flavor foss

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-gplay-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-gplay-release.apk
            build/app/outputs/flutter-apk/app-x86_64-gplay-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-foss-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-foss-release.apk
            build/app/outputs/flutter-apk/app-x86_64-foss-release.apk
          if-no-files-found: error
          overwrite: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/fossRelease/app-foss-release.aab
          if-no-files-found: error
          overwrite: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-google-play-aab
          path: build/app/outputs/bundle/gplayRelease/app-gplay-release.aab
          if-no-files-found: error
          overwrite: true

  # ──────────────────────────────────────────────────────────
  # iOS — IPA → App Store
  # Uses xcodebuild with -allowProvisioningUpdates so Xcode
  # manages profiles automatically via App Store Connect API.
  # No provisioning profile secrets needed.
  # ──────────────────────────────────────────────────────────
  build-ios:
    name: Build · iOS
    needs: release-plan
    if: >-
      ${{
        github.event_name == 'push' ||
        inputs.dry_run ||
        inputs.all_stores ||
        inputs.ios_app_store
      }}
    runs-on: macos-26  # Xcode 26 — required by Apple (iOS 26 SDK) since Apr 2026
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: ruby/setup-ruby@12fd324f1d0b43274fdc8130f6980590a667c455 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Import certificates
        env:
          DEV_CERT_BASE64: ${{ secrets.APPLE_DEVELOPMENT_CERT_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERT_PASSWORD }}
          DIST_CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DEV_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" \
            -P "$DEV_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          echo "$DIST_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/.private_keys
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" | base64 --decode \
            > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Configure Xcode project
        run: flutter build ios --config-only --release --no-codesign

      - name: Archive iOS app
        run: |
          cd ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Install provisioning profiles & generate ExportOptions
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cd ios && bundle exec fastlane install_profiles

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath build/ios/ipa

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          overwrite: true

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

  publish-ios-app-store:
    name: Publish · Apple App Store (iOS)
    needs: build-ios
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.all_stores || inputs.ios_app_store) &&
         !inputs.dry_run)
      }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: ruby/setup-ruby@12fd324f1d0b43274fdc8130f6980590a667c455 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-ipa
          path: build/ios/ipa

      - name: Upload to App Store
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          IPA_DIR: ${{ github.workspace }}/build/ios/ipa
        run: cd ios && bundle exec fastlane deploy

  # ──────────────────────────────────────────────────────────
  # macOS — pkg → App Store
  # ──────────────────────────────────────────────────────────
  build-macos:
    name: Build · macOS
    needs: release-plan
    if: >-
      ${{
        github.event_name == 'push' ||
        inputs.dry_run ||
        inputs.all_stores ||
        inputs.macos_app_store
      }}
    runs-on: macos-26  # Xcode 26 — required by Apple (macOS 26 SDK) since Apr 2026
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: ruby/setup-ruby@12fd324f1d0b43274fdc8130f6980590a667c455 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Disable Swift Package Manager (use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - run: flutter pub get

      - name: Install CocoaPods
        run: cd macos && pod install --repo-update

      - name: Import certificates
        env:
          DISTRIBUTION_CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DISTRIBUTION_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -P "$DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          echo "$INSTALLER_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" \
            -P "$INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          if [ -n "$MACOS_PROFILE_BASE64" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$MACOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/macos.provisionprofile"
            UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
              <<< "$(security cms -D -i "$RUNNER_TEMP/macos.provisionprofile")")
            cp "$RUNNER_TEMP/macos.provisionprofile" \
              ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".provisionprofile
          fi

      - name: Build macOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          cd macos
          bundle exec fastlane prepare_signing
          cd ..
          flutter build macos --release

      - name: Create installer pkg
        env:
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/huda.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          fi
          echo "Packaging: $APP_PATH"

          productbuild \
            --sign "$MACOS_INSTALLER_IDENTITY" \
            --component "$APP_PATH" /Applications \
            build/macos/Huda-macOS.pkg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-pkg
          path: build/macos/Huda-macOS.pkg
          if-no-files-found: error
          overwrite: true

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

  publish-macos-app-store:
    name: Publish · Apple App Store (macOS)
    needs: build-macos
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.all_stores || inputs.macos_app_store) &&
         !inputs.dry_run)
      }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: ruby/setup-ruby@12fd324f1d0b43274fdc8130f6980590a667c455 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-pkg
          path: build/macos

      - name: Upload to App Store
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          PKG_PATH: ${{ github.workspace }}/build/macos/Huda-macOS.pkg
        run: cd macos && bundle exec fastlane deploy

  # ──────────────────────────────────────────────────────────
  # Windows — MSIX → Microsoft Store
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: Build · Windows
    needs: release-plan
    if: >-
      ${{
        github.event_name == 'push' ||
        inputs.dry_run ||
        inputs.all_stores ||
        inputs.microsoft_store
      }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Sync MSIX version from pubspec
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml -Raw
          if ($content -match 'version:\s+(\d+\.\d+\.\d+)') {
            $version = $Matches[1] + ".0"
            $content = $content -replace 'msix_version:\s+\S+', "msix_version: $version"
            Set-Content pubspec.yaml $content
            Write-Host "MSIX version set to $version"
          }

      - name: Build Windows
        run: flutter build windows --release

      - name: Create MSIX
        run: dart run msix:create --store

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-msix
          path: build/**/*.msix
          if-no-files-found: error
          overwrite: true

      # Standalone .exe installer (Inno Setup) for direct download from the
      # GitHub Release — version is read from pubspec, no manual edits needed.
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml -Raw
          if ($content -match 'version:\s+(\d+\.\d+\.\d+)') {
            $version = $Matches[1]
          } else {
            throw "Could not read version from pubspec.yaml"
          }
          Write-Host "Building installer for version $version"
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer\desktop_inno_script.iss

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: installer/Output/*.exe
          if-no-files-found: error
          overwrite: true

  publish-microsoft-store:
    name: Publish · Microsoft Store
    needs: build-windows
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.all_stores || inputs.microsoft_store) &&
         !inputs.dry_run)
      }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-msix
          path: store-artifact

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@3b2ec9136230357ce9abc02b9d056626fb248d3f # v1

      - name: Upload to Microsoft Store
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          msstore reconfigure --tenantId "$env:AZURE_AD_TENANT_ID" --clientId "$env:AZURE_AD_CLIENT_ID" --clientSecret "$env:AZURE_AD_CLIENT_SECRET" --sellerId "$env:MS_STORE_SELLER_ID"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $msix = Get-ChildItem -Path store-artifact -Recurse -Filter "*.msix" | Select-Object -First 1
          if (-not $msix) {
            throw "No MSIX package found in the downloaded artifact"
          }

          $maxAttempts = 5
          $delaySeconds = 60

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Uploading MSIX to a Microsoft Store draft (attempt $attempt/$maxAttempts)"
            msstore publish "$($msix.FullName)" --appId "$env:MS_STORE_APP_ID" --noCommit -v

            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              exit $LASTEXITCODE
            }

            Write-Warning "Microsoft Store upload failed with exit code $LASTEXITCODE. Retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
          }

          Write-Host "Updating Microsoft Store release notes"
          $releaseNotesScript = Join-Path $env:GITHUB_WORKSPACE "distribution/release-notes/update-microsoft-store-release-notes.ps1"
          if (-not (Test-Path -LiteralPath $releaseNotesScript)) {
            throw "Microsoft Store release-notes script not found: $releaseNotesScript"
          }
          & $releaseNotesScript -ProductId "$env:MS_STORE_APP_ID"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Publishing Microsoft Store submission (attempt $attempt/$maxAttempts)"
            msstore submission publish "$env:MS_STORE_APP_ID" -v

            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              exit $LASTEXITCODE
            }

            Write-Warning "Microsoft Store submission publish failed with exit code $LASTEXITCODE. Retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
          }

  # ──────────────────────────────────────────────────────────
  # Linux — snap → Snapcraft Store
  # ──────────────────────────────────────────────────────────
  build-linux:
    name: Build · Linux snap
    needs: release-plan
    if: >-
      ${{
        github.event_name == 'push' ||
        inputs.dry_run ||
        inputs.all_stores ||
        inputs.snapcraft
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - name: Sync snap version from pubspec
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          sed -i "s/^version:.*/version: '$VERSION'/" snap/snapcraft.yaml
          echo "Snap version set to $VERSION"

      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: snapcraft

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
          overwrite: true

  publish-snapcraft:
    name: Publish · Snapcraft
    needs: build-linux
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.all_stores || inputs.snapcraft) &&
         !inputs.dry_run)
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-snap
          path: store-artifact

      - name: Find snap artifact
        id: snap
        shell: bash
        run: |
          SNAP_PATH=$(find store-artifact -type f -name '*.snap' -print -quit)
          if [[ -z "$SNAP_PATH" ]]; then
            echo "No snap found in the downloaded artifact" >&2
            exit 1
          fi
          echo "path=$SNAP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to Snapcraft Store
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: stable

  # ──────────────────────────────────────────────────────────
  # Google Play — consume the signed gplay AAB from build-android
  # ──────────────────────────────────────────────────────────
  publish-google-play:
    name: Publish · Google Play
    needs: build-android
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.all_stores || inputs.google_play) &&
         !inputs.dry_run)
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-google-play-aab
          path: store-artifact

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aw.huda
          releaseFiles: store-artifact/app-gplay-release.aab
          track: production
          status: completed
          whatsNewDirectory: distribution/release-notes/google-play

  # ──────────────────────────────────────────────────────────
  # Huawei AppGallery — AAB upload via Publishing API
  # Uses a team-level Connect API client (client_id + client_secret).
  # Service-account JSON keys are NOT accepted by the Publishing API.
  # ──────────────────────────────────────────────────────────
  publish-appgallery:
    name: Publish · Huawei AppGallery
    needs: build-android
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.all_stores || inputs.appgallery) &&
         !inputs.dry_run)
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-aab
          path: store-artifact

      - name: Upload to AppGallery
        env:
          HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
          HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
        run: |
          set -euo pipefail
          pip install requests
          python3 distribution/appgallery_upload.py --aab store-artifact/app-foss-release.aab

  # ──────────────────────────────────────────────────────────
  # GitHub Release — collect all artifacts
  # ──────────────────────────────────────────────────────────
  create-release:
    name: Publish · GitHub Release
    needs: [build-android, build-ios, build-macos, build-windows, build-linux]
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          VERSION=${GITHUB_REF_NAME#v}

          if [ -d release-artifacts/android-apk ]; then
            for flavor in gplay foss; do
              for abi in armeabi-v7a arm64-v8a x86_64; do
                source="release-artifacts/android-apk/app-${abi}-${flavor}-release.apk"
                if [ ! -f "$source" ]; then
                  echo "Missing expected release APK: $source" >&2
                  exit 1
                fi
                cp "$source" "release-assets/Huda-${VERSION}-android-${flavor}-${abi}.apk"
              done
            done
          fi

          find release-artifacts/windows-msix -name "*.msix" -exec \
            cp {} "release-assets/Huda-${VERSION}-windows.msix" \; 2>/dev/null || true

          find release-artifacts/windows-installer -name "*.exe" -exec \
            cp {} "release-assets/Huda-${VERSION}-windows-setup.exe" \; 2>/dev/null || true

          [ -f release-artifacts/macos-pkg/Huda-macOS.pkg ] && \
            cp release-artifacts/macos-pkg/Huda-macOS.pkg "release-assets/Huda-${VERSION}-macOS.pkg"

          find release-artifacts/linux-snap -name "*.snap" -exec \
            cp {} "release-assets/Huda-${VERSION}-linux.snap" \; 2>/dev/null || true

          find release-artifacts/ios-ipa -name "*.ipa" -exec \
            cp {} "release-assets/Huda-${VERSION}-ios.ipa" \; 2>/dev/null || true

          echo "Release assets:"
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: distribution/release-notes/github.md
          files: release-assets/*
          fail_on_unmatched_files: false
