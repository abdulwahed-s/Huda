name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only — skip store uploads'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.41.5'

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────
  # Android — AAB → Google Play, APK → artifact
  # ──────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Create API keys file
        env:
          DART_KEYS_FILE: ${{ secrets.DART_KEYS_FILE }}
        run: |
          mkdir -p lib/core/keys
          printf '%s' "$DART_KEYS_FILE" | base64 --decode > lib/core/keys/hadith_key.dart

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Build APK
        run: flutter build apk --release

      - name: Upload to Google Play
        if: ${{ !inputs.dry_run }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aw.huda
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # ──────────────────────────────────────────────────────────
  # iOS — IPA → App Store
  # Uses xcodebuild with -allowProvisioningUpdates so Xcode
  # manages profiles automatically via App Store Connect API.
  # No provisioning profile secrets needed.
  # ──────────────────────────────────────────────────────────
  build-ios:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: ruby/setup-ruby@12fd324f1d0b43274fdc8130f6980590a667c455 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: flutter pub get

      - name: Create API keys file
        env:
          DART_KEYS_FILE: ${{ secrets.DART_KEYS_FILE }}
        run: |
          mkdir -p lib/core/keys
          printf '%s' "$DART_KEYS_FILE" | base64 --decode > lib/core/keys/hadith_key.dart

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Import certificates
        env:
          DEV_CERT_BASE64: ${{ secrets.APPLE_DEVELOPMENT_CERT_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERT_PASSWORD }}
          DIST_CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DEV_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" \
            -P "$DEV_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          echo "$DIST_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/.private_keys
          printf '%s' "$APP_STORE_CONNECT_KEY_P8" | base64 --decode \
            > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive iOS app
        run: |
          cd ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon

      - name: Install provisioning profiles & generate ExportOptions
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cd ios && bundle exec fastlane install_profiles

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath build/ios/ipa

      - name: Upload to App Store
        if: ${{ !inputs.dry_run }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: cd ios && bundle exec fastlane deploy

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

  # ──────────────────────────────────────────────────────────
  # macOS — pkg → App Store
  # ──────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: ruby/setup-ruby@12fd324f1d0b43274fdc8130f6980590a667c455 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - run: flutter pub get

      - name: Create API keys file
        env:
          DART_KEYS_FILE: ${{ secrets.DART_KEYS_FILE }}
        run: |
          mkdir -p lib/core/keys
          printf '%s' "$DART_KEYS_FILE" | base64 --decode > lib/core/keys/hadith_key.dart

      - name: Install CocoaPods
        run: cd macos && pod install --repo-update

      - name: Import certificates
        env:
          DISTRIBUTION_CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          MACOS_PROFILE_BASE64: ${{ secrets.MACOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$DISTRIBUTION_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -P "$DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          echo "$INSTALLER_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" \
            -P "$INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          if [ -n "$MACOS_PROFILE_BASE64" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$MACOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/macos.provisionprofile"
            UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
              <<< "$(security cms -D -i "$RUNNER_TEMP/macos.provisionprofile")")
            cp "$RUNNER_TEMP/macos.provisionprofile" \
              ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".provisionprofile
          fi

      - name: Build macOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME = huda_icon/ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon/g' \
            macos/Runner.xcodeproj/project.pbxproj
          cd macos
          bundle exec fastlane run update_code_signing_settings \
            use_automatic_signing:false \
            path:Runner.xcodeproj \
            team_id:"$APPLE_TEAM_ID" \
            code_sign_identity:"Apple Distribution"
          cd ..
          flutter build macos --release

      - name: Create installer pkg
        env:
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/huda.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          fi
          echo "Packaging: $APP_PATH"

          productbuild \
            --sign "$MACOS_INSTALLER_IDENTITY" \
            --component "$APP_PATH" /Applications \
            build/macos/Huda-macOS.pkg

      - name: Upload to App Store
        if: ${{ !inputs.dry_run }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: cd macos && bundle exec fastlane deploy

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-pkg
          path: build/macos/Huda-macOS.pkg

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

  # ──────────────────────────────────────────────────────────
  # Windows — MSIX → Microsoft Store
  # ──────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Create API keys file
        shell: pwsh
        env:
          DART_KEYS_FILE: ${{ secrets.DART_KEYS_FILE }}
        run: |
          New-Item -ItemType Directory -Force -Path lib/core/keys | Out-Null
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:DART_KEYS_FILE)) | Set-Content lib/core/keys/hadith_key.dart

      - name: Sync MSIX version from pubspec
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml -Raw
          if ($content -match 'version:\s+(\d+\.\d+\.\d+)') {
            $version = $Matches[1] + ".0"
            $content = $content -replace 'msix_version:\s+\S+', "msix_version: $version"
            Set-Content pubspec.yaml $content
            Write-Host "MSIX version set to $version"
          }

      - name: Build Windows
        run: flutter build windows --release

      - name: Create MSIX
        run: dart run msix:create --store

      - name: Setup Microsoft Store CLI
        if: ${{ !inputs.dry_run }}
        uses: microsoft/setup-msstore-cli@3b2ec9136230357ce9abc02b9d056626fb248d3f # v1

      - name: Upload to Microsoft Store
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
        run: |
          msstore reconfigure `
            --tenantId "$env:AZURE_AD_TENANT_ID" `
            --clientId "$env:AZURE_AD_CLIENT_ID" `
            --clientSecret "$env:AZURE_AD_CLIENT_SECRET" `
            --sellerId "$env:MS_STORE_SELLER_ID"

          $msix = Get-ChildItem -Path build -Recurse -Filter "*.msix" | Select-Object -First 1
          msstore publish "$($msix.FullName)" --appId "$env:MS_STORE_APP_ID" -v

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-msix
          path: build/**/*.msix

  # ──────────────────────────────────────────────────────────
  # Linux — snap → Snapcraft Store
  # ──────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create API keys file
        env:
          DART_KEYS_FILE: ${{ secrets.DART_KEYS_FILE }}
        run: |
          mkdir -p lib/core/keys
          printf '%s' "$DART_KEYS_FILE" | base64 --decode > lib/core/keys/hadith_key.dart

      - name: Sync snap version from pubspec
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          sed -i "s/^version:.*/version: '$VERSION'/" snap/snapcraft.yaml
          echo "Snap version set to $VERSION"

      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: snapcraft

      - name: Upload to Snapcraft Store
        if: ${{ !inputs.dry_run }}
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-snap
          path: ${{ steps.snapcraft.outputs.snap }}

  # ──────────────────────────────────────────────────────────
  # Huawei AppGallery — APK upload via Publishing API (JWT)
  # ──────────────────────────────────────────────────────────
  upload-appgallery:
    needs: build-android
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-aab

      - name: Upload to AppGallery
        env:
          HUAWEI_API_KEY_JSON: ${{ secrets.HUAWEI_API_KEY_JSON }}
          HUAWEI_APP_ID: ${{ secrets.HUAWEI_APP_ID }}
        run: |
          set -euo pipefail
          pip install PyJWT cryptography requests

          python3 << 'PYEOF'
          import json, os, time, sys
          import jwt
          import requests

          key_json = json.loads(os.environ["HUAWEI_API_KEY_JSON"])
          app_id = os.environ["HUAWEI_APP_ID"]

          # 1. Create JWT signed with PS256
          now = int(time.time())
          headers = {"kid": key_json["key_id"], "typ": "JWT", "alg": "RS256"}
          payload = {
              "iss": key_json["sub_account"],
              "aud": key_json["token_uri"],
              "iat": now,
              "exp": now + 3600,
          }
          signed_jwt = jwt.encode(payload, key_json["private_key"], algorithm="RS256", headers=headers)

          # 2. Exchange JWT for access token
          token_resp = requests.post(key_json["token_uri"], data={
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion": signed_jwt,
          })
          if not token_resp.ok:
              print(f"Token request failed: HTTP {token_resp.status_code}")
              token_resp.raise_for_status()
          access_token = token_resp.json()["access_token"]
          print("✓ Obtained access token")

          auth_headers = {
              "Authorization": f"Bearer {access_token}",
              "Content-Type": "application/json",
          }

          BASE = "https://connect-api.cloud.huawei.com/api/publish/v2"

          # 3. Get upload URL
          upload_meta = requests.get(
              f"{BASE}/upload-url?appId={app_id}&suffix=aab&releaseType=1",
              headers=auth_headers,
          ).json()
          upload_url = upload_meta["uploadUrl"]
          auth_code = upload_meta["authCode"]
          print(f"✓ Got upload URL")

          # 4. Upload AAB
          with open("app-release.aab", "rb") as f:
              upload_resp = requests.post(upload_url, data={
                  "authCode": auth_code,
                  "fileCount": "1",
              }, files={"file": ("app-release.aab", f, "application/octet-stream")})
          upload_result = upload_resp.json()
          file_dest_url = upload_result["result"]["UploadFileRsp"]["fileInfoList"][0]["fileDestUlr"]
          print("✓ AAB uploaded")

          # 5. Update app file info
          resp = requests.put(f"{BASE}/app-file-info?appId={app_id}", headers=auth_headers, json={
              "fileType": 5,
              "files": [{"fileName": "app-release.aab", "fileDestUrl": file_dest_url}],
          })
          resp.raise_for_status()
          print("✓ App file info updated")

          # 5.5. Set localised release notes
          import glob

          LOCALE_MAP = {
              "whatsnew-en-US": "en_US",
              "whatsnew-ar":    "ar",
              "whatsnew-de-DE": "de_DE",
              "whatsnew-es-ES": "es_ES",
              "whatsnew-fr-FR": "fr_FR",
              "whatsnew-bn-BD": "bn_BD",
              "whatsnew-ms":    "ms_MY",
              "whatsnew-ru-RU": "ru_RU",
              "whatsnew-tr-TR": "tr_TR",
              "whatsnew-ur":    "ur",
          }

          for filepath in sorted(glob.glob("distribution/whatsnew/whatsnew-*")):
              filename = os.path.basename(filepath)
              lang = LOCALE_MAP.get(filename)
              if not lang:
                  continue
              text = open(filepath, encoding="utf-8").read().strip()
              resp = requests.put(
                  f"{BASE}/new-features?appId={app_id}&lang={lang}",
                  headers=auth_headers,
                  json={"newFeatures": text},
              )
              if resp.ok:
                  print(f"✓ Release notes [{lang}]")
              else:
                  print(f"⚠ Release notes [{lang}]: {resp.status_code} {resp.text}")

          # 6. Submit for review
          resp = requests.post(f"{BASE}/app-submit?appId={app_id}", headers=auth_headers)
          resp.raise_for_status()
          print("✓ Submitted to AppGallery for review")
          PYEOF

  # ──────────────────────────────────────────────────────────
  # GitHub Release — collect all artifacts
  # ──────────────────────────────────────────────────────────
  create-release:
    needs: [build-android, build-ios, build-macos, build-windows, build-linux]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          VERSION=${GITHUB_REF_NAME#v}

          [ -f release-artifacts/android-apk/app-release.apk ] && \
            cp release-artifacts/android-apk/app-release.apk "release-assets/Huda-${VERSION}-android.apk"

          find release-artifacts/windows-msix -name "*.msix" -exec \
            cp {} "release-assets/Huda-${VERSION}-windows.msix" \; 2>/dev/null || true

          [ -f release-artifacts/macos-pkg/Huda-macOS.pkg ] && \
            cp release-artifacts/macos-pkg/Huda-macOS.pkg "release-assets/Huda-${VERSION}-macOS.pkg"

          find release-artifacts/linux-snap -name "*.snap" -exec \
            cp {} "release-assets/Huda-${VERSION}-linux.snap" \; 2>/dev/null || true

          find release-artifacts/ios-ipa -name "*.ipa" -exec \
            cp {} "release-assets/Huda-${VERSION}-ios.ipa" \; 2>/dev/null || true

          echo "Release assets:"
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: distribution/whatsnew/whatsnew-en-US
          files: release-assets/*
          fail_on_unmatched_files: false
