import com.android.build.api.variant.FilterConfiguration.FilterType

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def useLegacyNativeLibraryPackaging =
        project.findProperty("hudaUseLegacyPackaging")?.toString()?.toBoolean() ?: false
def hudaSplitPerAbi =
        project.findProperty("split-per-abi")?.toString()?.toBoolean() ?: false

// Keep Flutter's CLI/output-discovery contract, but let AGP's public Variant API
// own Huda's established ABI version codes instead of Flutter's legacy override.
if (hudaSplitPerAbi) {
    project.extensions.extraProperties.set("split-per-abi", "false")
}


android {
    namespace = "com.aw.huda"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = useLegacyNativeLibraryPackaging
        }
    }

    splits {
        abi {
            enable = hudaSplitPerAbi
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk = false
        }
    }

    defaultConfig {
        applicationId = "com.aw.huda"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions "store"
    productFlavors {
        gplay {
            dimension "store"
        }
        foss {
            dimension "store"
        }
        appgallery {
            dimension "store"
        }
    }
}

def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abiVersionCode = abiCodes[
                    output.filters.find { it.filterType == FilterType.ABI }?.identifier
            ]
            if (abiVersionCode != null) {
                def baseVersionCode = output.versionCode.get()
                output.versionCode.set(baseVersionCode * 10 + abiVersionCode)
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")

    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.2.20"))

    implementation("androidx.glance:glance-appwidget:1.1.1")
    implementation("androidx.glance:glance-material3:1.1.1")
    implementation("androidx.datastore:datastore-preferences:1.1.1")
    implementation("androidx.work:work-runtime-ktx:2.9.0")

    implementation("androidx.compose.foundation:foundation:1.6.0")
    implementation("androidx.compose.ui:ui:1.6.0")
    implementation("androidx.compose.runtime:runtime:1.6.0")

    implementation("io.github.abdulwahed-s:prayer-time-plus:0.3.0")
    implementation("com.google.code.gson:gson:2.13.2")
    implementation("net.iakovlev:timeshape:2026b.29") {
        exclude group: "com.github.luben", module: "zstd-jni"
    }
    // TimeShape uses SLF4J; give R8 the optional runtime binder it references.
    runtimeOnly("org.slf4j:slf4j-nop:1.7.30")
    implementation("com.github.luben:zstd-jni:1.5.7-11@aar")
    testImplementation("com.github.luben:zstd-jni:1.5.7-11")

    testImplementation("junit:junit:4.13.2")

    gplayImplementation("com.google.android.gms:play-services-location:21.2.0")
}
