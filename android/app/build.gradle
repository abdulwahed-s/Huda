import com.android.build.gradle.internal.api.ApkVariantOutputImpl

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def useLegacyNativeLibraryPackaging =
    project.findProperty("hudaUseLegacyPackaging")?.toString()?.toBoolean() ?: false


android {
    namespace = "com.aw.huda"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11

        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        compose = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = useLegacyNativeLibraryPackaging
        }
    }

    defaultConfig {
        applicationId = "com.aw.huda"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }
   buildTypes {
       release {
           signingConfig signingConfigs.release
       }
   }

    flavorDimensions "store"
    productFlavors {
        gplay {
            dimension "store"
        }
        foss {
            dimension "store"
        }
        appgallery {
            dimension "store"
        }
    }
}

def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
        def abiVersionCode = abiCodes[output.filters.find { it.filterType == "ABI" }?.identifier]
        if (abiVersionCode != null) {
            (output as ApkVariantOutputImpl).versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}

flutter {
    source = "../.."
}

configurations.all {
    resolutionStrategy {
        force "androidx.glance:glance-appwidget:1.1.1"
        force "androidx.glance:glance-material3:1.1.1"
    }
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")

    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.2.20"))

    implementation("androidx.glance:glance-appwidget:1.1.1")
    implementation("androidx.glance:glance-material3:1.1.1")
    
    implementation("androidx.work:work-runtime-ktx:2.9.0")
    
    implementation("androidx.compose.foundation:foundation:1.6.0")
    implementation("androidx.compose.ui:ui:1.6.0")
    implementation("androidx.compose.runtime:runtime:1.6.0")

    implementation("io.github.abdulwahed-s:prayer-time-plus:0.2.0")

    gplayImplementation("com.google.android.gms:play-services-location:21.2.0")
}
