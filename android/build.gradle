allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects { project ->
    // workmanager_android 0.9.3 assumes AGP 9 always enables built-in Kotlin.
    // Flutter's compatibility mode disables it, so explicitly compile its Kotlin.
    if (project.name == "workmanager_android" &&
            !providers.gradleProperty("android.builtInKotlin").getOrElse("true").toBoolean()) {
        project.pluginManager.withPlugin("com.android.library") {
            project.pluginManager.apply("org.jetbrains.kotlin.android")
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

subprojects { project ->
    if (project.name == "home_widget") {
        project.afterEvaluate {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }

            project.tasks.configureEach { task ->
                if (task.name.startsWith("compile") && task.name.endsWith("Kotlin")) {
                    task.kotlinOptions.jvmTarget = "11"
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
