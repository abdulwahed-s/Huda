name: huda
description: "A Islamic Companion App."
publish_to: 'none'

version: 3.6.0+44

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  meta: ^1.15.0
  equatable: ^2.0.7
  get_it: ^8.0.3

  # UI & rendering
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  vector_graphics: ^1.1.19
  lottie: ^3.1.2
  newton_particles: ^0.2.2
  scrollable_positioned_list: ^0.3.8
  flutter_markdown_plus: ^1.0.7

  # Audio
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.13
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.0.9
  audio_session: ^0.1.21

  # Networking & backend
  dio: ^5.8.0+1
  supabase_flutter: ^2.8.4

  # Storage & files
  shared_preferences: ^2.5.3
  path_provider: ^2.1.4
  path: ^1.9.1
  archive: ^4.0.4

  # Prayer times & qibla
  prayer_time_plus: ^0.2.0
  hijri: ^3.0.0
  precise_compass: ^0.1.0

  geolocator_platform_interface: ^4.2.6
  geolocator_apple: ^2.3.13
  geolocator_web: ^4.1.3
  geolocator_windows: ^0.2.5
  geocoding: ^4.0.0

  # Date & time
  jiffy: ^6.4.3
  intl: ^0.20.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

  # Notifications & background work
  flutter_local_notifications: ^19.5.0
  workmanager: ^0.9.0+2
  flutter_foreground_task: ^9.1.0
  alarm: ^5.2.1

  # Permissions
  permission_handler: ^12.0.1
  flutter_macos_permissions: ^2.0.7

  # Device & platform integration
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  home_widget: ^0.9.1
  quick_actions: ^1.1.0
  restart_app: ^1.7.3
  wakelock_plus: ^1.6.1
  vibration: ^3.1.3

  # Sharing & feedback
  share_plus: ^13.1.0
  feedback: ^3.2.0
  widgets_to_image: ^2.0.1

  # PDF
  pdfrx: ^2.2.24

  # Misc
  uuid: ^4.5.1
  synchronized: ^3.4.0
  url_launcher: ^6.3.2
  locale_names: ^1.1.1
  html: ^0.15.6
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  msix: ^3.16.12
  vector_graphics_compiler: ^1.1.19

msix_config:
  display_name: Huda
  publisher_display_name: awr
  publisher: CN=2AC3245E-4735-457B-BD0F-07BCB9F018F5
  identity_name: awr.Huda-IslamicCompanionApp
  msix_version: 3.5.0.0
  logo_path: assets/images/huda.png
  capabilities: internetClient, location, microphone, notifications
  languages: en-US, ar-SA, tr-TR, fr-FR, es-ES, de-DE, ru-RU, ur-PK, ms-MY, bn-BD

flutter_launcher_icons:
  image_path_android: "assets/images/huda_colored.png"
  image_path_ios: "assets/images/huda_colored.png"
  android: true
  ios: true
  adaptive_icon_background: "assets/images/back.png"
  adaptive_icon_foreground: "assets/images/huda_center.png"
  adaptive_icon_monochrome: "assets/images/huda_center.png"
  adaptive_icon_foreground_inset: 20
  web:
    generate: true
    image_path: "assets/images/huda_center.png"
    background_color: "#3a5c95"
    theme_color: "#3a5c95"
  windows:
    generate: true
    image_path: "assets/images/huda_center.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/huda_center.png"

flutter_native_splash:
  color: "#0c1d2b"
  image: "assets/images/huda_splash.png"
  android: true
  ios: true
  web: false
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: "assets/images/huda_splash.png"
    icon_background_color: "#0c1d2b"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/
    - assets/audio/

  fonts:
    - family: arsura
      fonts:
        - asset: assets/fonts/surah-name-v4.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
        - asset: assets/fonts/Amiri-BoldItalic.ttf
          style: italic
          weight: 700
    - family: IndoPak
      fonts:
        - asset: assets/fonts/Indopak.ttf
    - family: uthmanic
      fonts:
        - asset: assets/fonts/hafs-uthmanic-v14-full-org.ttf
